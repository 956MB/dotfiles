# https://starship.rs/config/

format = """
$username\
$hostname\
$battery\
$directory\
$vcsh\
$git_commit\
${custom.jj}\
$git_state\
$bun\
$cmake\
$golang\
$lua\
$python\
$rust\
$swift\
$zig\
$hg_branch\
$jobs\
$character"""

right_format = """$status$cmd_duration""" # $git_branch removed — custom.jj shows bookmarks/change id

# ${custom.git_branch}\

[username]
format = "(blue)[$user]($style)"
style_user = "bold blue"
style_root = "bold red"
show_always = true

[hostname]
format = '@[$hostname]($style)'
style = "bold blue"
ssh_only = true
disabled = false
aliases = { "AlexandacStudio" = "macstudio", "AlexandacStudio.attlocal.net" = "macstudio", "Alexanders-Mac-Studio" = "macstudio", "Mac.attlocal.net" = "macstudio", "Mac" = "macstudio" }

[battery]
full_symbol = " "
charging_symbol = " "
discharging_symbol = " "
disabled = false

[[battery.display]]  # "bold red" style when capacity is between 0% and 20%
threshold = 20
style = "bold red"

[[battery.display]]  # "bold yellow" style when capacity is between 20% and 50%
threshold = 50
style = "bold yellow"

[[battery.display]]  # "bold green" style when capacity is between 50% and 100%
threshold = 100
style = "bold green"

[time]
# format = "at [$time]($style) "
time_format = "%T"
style = "bold bright-cyan"
disabled = false

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "purple"
truncation_length = 0
truncate_to_repo = true
truncation_symbol = ": "

[git_metrics]
disabled = true

# [git_metrics]
# disabled = false
# format = '([$deleted]($style_deleted)[$renamed]($style_renamed)[$modified]($style_modified))'
# style_deleted = 'bold red'
# style_modified = 'bold blue'  # or 'bold yellow' if you prefer orange
# style_renamed = 'bold green'

[git_commit]
# Disabled: in jj colocated repos HEAD is always detached at the working-copy
# commit, so this only renders a hash that churns on every snapshot.
# custom.jj (jj-starship) shows the stable change id instead.
disabled = true

[custom.jj]
# jj-starship — unified git/jujutsu prompt module (dmmulroy/jj-starship).
# Shows change id, bookmarks, and status symbols in jj repos; branch + status
# in plain git repos. Replaces $git_branch / $git_status / custom.git_changes.
when = "jj-starship detect"
shell = ["jj-starship", "--no-symbol", "--ancestor-bookmark-depth", "0"]
format = "$output "

[custom.git_changes]
# Disabled: stale/staged counts are meaningless in jj working copies (no index),
# and jj-starship's status symbols replace them for git repos too.
disabled = true
command = '''
if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
    # Get unstaged changes (working dir vs index)
    unstaged=$(git diff --shortstat 2>/dev/null)
    # Get staged changes (index vs HEAD)
    staged=$(git diff --cached --shortstat 2>/dev/null)
    # Get untracked files count
    untracked=$(git ls-files --others --exclude-standard 2>/dev/null | wc -l | tr -d " ")
    # Get staged files count
    staged_files=$(git diff --cached --name-only 2>/dev/null | wc -l | tr -d " ")
    
    # Process all stats
    echo -e "$unstaged\n$staged" | awk -v untracked="$untracked" -v staged_files="$staged_files" '
    BEGIN { modified=0; added=0; deleted=0; }
    {
        for(i=1;i<=NF;i++) {
            if($(i+1)=="file" || $(i+1)=="files") modified+=$(i);
            else if($(i+1)=="insertion(+)" || $(i+1)=="insertions(+)") added+=$(i);
            else if($(i+1)=="deletion(-)" || $(i+1)=="deletions(-)") deleted+=$(i);
        }
    }
    END {
        # Calculate totals
        total_new = untracked + staged_files;
        
        out="";
        # ANSI slots, so git changes follow the terminal palette per appearance:
        # 31 red deleted, 96 bright-cyan modified, 92 bright-green added+untracked, 93 bright-yellow staged adds.
        # dark #ff7676 / #5abfb5 / #86cd82 / #d9ba73 (previous values) — light #ca0043 / #007d7d / #019833 / #b07700.
        if(deleted>0) out=out sprintf("\033[31m-%s\033[0m", deleted);
        if(modified>0) out=out sprintf("\033[96m~%s\033[0m", modified);
        if(total_new>0) out=out sprintf("\033[92m+%s\033[0m", total_new);
        if(added>0) out=out sprintf("\033[93m↑%s\033[0m", added);
        if(out!="") print "[" out "]";
    }'
fi
'''
when = "true"
shell = ["bash", "--noprofile", "--norc"]
style = "white" # ANSI slot 7: dark #a5a5a5 / light #5a5a5a (6.9:1) — neutral wrapper


[git_status]
# Disabled: superseded by custom.jj status symbols (jj-starship).
disabled = true
style = "white"
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"
deleted = "x"

[cmd_duration]
min_time = 1
format = "[$duration]($style) "
disabled = false

[status]
format = '[$status $common_meaning(SIG$signal_name)]($style) '
# ANSI slot 1 (red) instead of a hex: the prompt then follows the terminal palette per appearance.
# dark #ff7676 (the previous value) / light #ca0043 (5.9:1 on white). Non-bold keeps it dim.
style = "red"
map_symbol = true
disabled = false

[jobs]
format = "[($number )more jobs]($style) "
threshold = 1
disabled = false


[character]
# ANSI slots (14 bright-cyan / 1 red), so the prompt follows the terminal palette per appearance:
# λ dark #5abfb5 / light #007d7d (5.0:1 on white), Σ dark #ff7676 / light #ca0043.
# Was fixed hexes (#8ebeec / #ff7676), which were barely visible on the light background.
success_symbol = "(bright-cyan)[λ](bright-cyan)"
error_symbol = "(red)[Σ](red)"

[bun]
symbol = "Bun: "
# ANSI slot 5 (purple/magenta): dark #f4b8e4 / light #a200d1 (6.1:1 on white). Was the fixed #F471B5.
style = "purple"
format = "[$symbol($version )]($style)"

[cmake]
symbol = "謁 "
format = "[$symbol($version )]($style)"

[git_branch]
# Disabled: superseded by custom.jj bookmarks (jj-starship).
disabled = true
symbol = ""
# ANSI slot 11 (bright-yellow): dark #d9ba73 (the previous value) / light #b07700 (3.8:1 on white).
style = "bright-yellow"
format = "[$symbol$branch]($style)"

[golang]
symbol = "󰟓 "
style = "blue"
format = "[$symbol($version )]($style)"

[lua]
symbol = " "
style = "blue"
format = "[$symbol($version )]($style)"

[python]
symbol = " "
style = "bold blue"
format = "[$symbol($version )]($style)"
# python_binary = 'python3'
# pyenv_version_name = true

[rust]
symbol = " "

[swift]
symbol = " "

[zig]
symbol = " "
style = "bold yellow"
format = "[$symbol($version )]($style)"
