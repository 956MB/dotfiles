
experimental_log_batching_enabled = false

[bookmark]
interactive_bookmark_pane = true

[keys]
  up = ["up", "k"]
  down = ["down", "j"]
  jump_to_parent = ["J"]
  jump_to_working_copy = ["@"]
  apply = ["enter"]
  cancel = ["esc"]
  toggle_select = [" "]
  new = ["n"]
  commit = ["c"]
  refresh = ["ctrl+r"]
  abandon = ["a"]
  diff = ["d"]
  quit = ["q"]
  help = ["?"]
  describe = ["D"]
  edit = ["e"]
  diffedit = ["E"]
  absorb = ["A"]
  split = ["s"]
  squash = ["S"]
  undo = ["u"]
  evolog = ["v"]
  revset = ["L"]
  quick_search = ["/"]
  quick_search_cycle = ["'"]
  custom_commands = ["x"]
  suspend = ["ctrl+z"]
  [keys.rebase]
    mode = ["r"]
    revision = ["r"]
    source = ["s"]
    branch = ["B"]
    after = ["a"]
    before = ["b"]
    onto = ["d"]
    insert = ["i"]
  [keys.details]
    mode = ["l"]
    close = ["h"]
    split = ["s"]
    restore = ["r"]
    diff = ["d"]
    select = ["m", " "]
    revisions_changing_file = ["*"]
  [keys.preview]
    mode = ["p"]
    scroll_up = ["ctrl+p"]
    scroll_down = ["ctrl+d"]
    half_page_down = ["ctrl+pgdown"]
    half_page_up = ["ctrl+pgup"]
    expand = ["ctrl+j"]
    shrink = ["ctrl+k"]
  [keys.bookmark]
    mode = ["b"]
    set = ["B"]
    delete = ["d"]
    move = ["m"]
    forget = ["f"]
    track = ["t"]
    untrack = ["u"]
  [keys.git]
    mode = ["g"]
    push = ["p"]
    fetch = ["f"]
  [keys.oplog]
    mode = ["o"]
    restore = ["r"]

[ui]
  theme = "greyscale-koda"
  highlight_dark = "#272727" # koda-dark selection surface (ghostty selection-background)
  highlight_light = "#404040"
  auto_refresh_interval = 0

[preview]
  extra_args = []
  show_at_start = true
  width_percentage = 60.0
  width_increment_percentage = 5.0

[oplog]
  limit = 200

[revisions]
  revset = "all()"

[custom_commands]

# Push to every remote the current repo has (github, codeberg, gitlab,
# sourcehut, tangled here) — replaces lazygit's <c-p> `_all_` custom command.
# Remotes are discovered live via `jj git remote list`, no static list.
[[actions]]
name = "push-all"
lua = '''
local out, err = jj("git", "remote", "list")
if err ~= nil then
    flash({ text = "remote list failed: " .. tostring(err), error = true, sticky = true })
    return
end
local pushed, failed = 0, ""
for _, line in ipairs(split_lines(out)) do
    local remote = line:match("^(%S+)")
    if remote ~= nil then
        local _, perr = jj("git", "push", "--remote", remote)
        if perr ~= nil then
            failed = failed .. " " .. remote
        else
            pushed = pushed + 1
        end
    end
end
if failed ~= "" then
    flash({ text = pushed .. " ok, failed:" .. failed, error = true, sticky = true })
else
    flash("pushed to " .. pushed .. " remotes")
end
'''

[[bindings]]
action = "push-all"
key = "ctrl+shift+p"
scope = "revisions"
desc = "push to all remotes"
