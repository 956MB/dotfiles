
experimental_log_batching_enabled = false

[bookmark]
interactive_bookmark_pane = true

[ui]
  theme = "greyscale-koda"
  highlight_dark = "#272727" # koda-dark selection surface (ghostty selection-background)
  highlight_light = "#404040"
  auto_refresh_interval = 0

[preview]
  extra_args = []
  show_at_start = true
  width_percentage = 60.0
  width_increment_percentage = 5.0

[oplog]
  limit = 200

[revisions]
  revset = "all()"

# Key bindings — migrated from the legacy [keys] section (jjui v0.10).
# Everything that matched v0.10 defaults was dropped; only these differ:
#   rebase "onto" = d      (default moved onto to "o")
#   preview scroll/half-page/expand/shrink keys (v0.10 changed them to
#   ctrl+n / ctrl+d / ctrl+u / ctrl+h / ctrl+l — the old keys are re-bound below)
[[bindings]]
action = "revisions.rebase.set_target"
key = "d"
scope = "revisions.rebase"
args.target = "onto"
desc = "rebase onto selected"

[[bindings]]
action = "ui.preview_scroll_down"
key = "ctrl+d"
scope = "ui.preview"
desc = "preview scroll down"

[[bindings]]
action = "ui.preview_half_page_down"
key = "ctrl+pgdown"
scope = "ui.preview"
desc = "preview half page down"

[[bindings]]
action = "ui.preview_half_page_up"
key = "ctrl+pgup"
scope = "ui.preview"
desc = "preview half page up"

[[bindings]]
action = "ui.preview_expand"
key = "ctrl+j"
scope = "ui.preview"
desc = "preview expand"

[[bindings]]
action = "ui.preview_shrink"
key = "ctrl+k"
scope = "ui.preview"
desc = "preview shrink"

# Push to every remote the current repo has (github, codeberg, gitlab,
# sourcehut, tangled here) — replaces lazygit's <c-p> `_all_` custom command.
# Remotes are discovered live via `jj git remote list`, no static list.
[[actions]]
name = "push-all"
lua = '''
local out, err = jj("git", "remote", "list")
if err ~= nil then
    flash({ text = "remote list failed: " .. tostring(err), error = true, sticky = true })
    return
end
local pushed, failed = 0, ""
for _, line in ipairs(split_lines(out)) do
    local remote = line:match("^(%S+)")
    if remote ~= nil then
        local _, perr = jj("git", "push", "--remote", remote)
        if perr ~= nil then
            failed = failed .. " " .. remote
        else
            pushed = pushed + 1
        end
    end
end
if failed ~= "" then
    flash({ text = pushed .. " ok, failed:" .. failed, error = true, sticky = true })
else
    flash("pushed to " .. pushed .. " remotes")
end
'''

[[bindings]]
action = "push-all"
key = "ctrl+shift+p"
scope = "revisions"
desc = "push to all remotes"
