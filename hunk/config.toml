# https://github.com/modem-dev/hunk#config

theme = "custom"
mode = "auto"
vcs = "git"
watch = false
exclude_untracked = false
line_numbers = true
wrap_lines = false
menu_bar = true
agent_notes = true
transparent_background = true

[custom_theme]
base = "vesper"
# kanso (previous theme):
# label = "kanso"
# accent = "#7ab0a8"
# panel = "#151515"
# noteBorder = "#7289b6"
# matte-black previous values:
# label = "matte-black"
# accent = "#F59E0B"
# panel = "#121212"
# noteBorder = "#8A8A8A"
# greyscale = koda-dark semantic colors with deep matte-black diff washes
label = "greyscale"
accent = "#d9ba73"
panel = "#101010"
noteBorder = "#8ebeec"

# [[ Diff colors — koda-dark syntax with deep matte-black washes ]]
background = "#101010"       # koda bg
panelAlt = "#474747"         # koda dim
border = "#272727"           # koda line
accentMuted = "#505050"      # neutral comment gray
text = "#b0b0b0"             # koda fg
muted = "#505050"            # neutral comment gray
addedBg = "#0D221B"          # deep matte-black washAdd
removedBg = "#261010"        # deep matte-black washDel
movedAddedBg = "#0D221B"
movedRemovedBg = "#261010"
contextBg = "#272727"        # koda line
addedContentBg = "#0E402F"   # deep matte-black emph add
removedContentBg = "#4A1414" # deep matte-black emph del
contextContentBg = "#474747" # koda dim
addedSignColor = "#86cd82"   # koda success
removedSignColor = "#ff7676" # koda danger
lineNumberBg = "#101010"
lineNumberFg = "#505050"
selectedHunk = "#d9ba73"
badgeAdded = "#86cd82"
badgeRemoved = "#ff7676"
badgeNeutral = "#505050"
fileNew = "#86cd82"
fileDeleted = "#ff7676"
fileRenamed = "#8ebeec"
fileModified = "#8ebeec"
fileUntracked = "#505050"
noteBackground = "#272727"
noteTitleBackground = "#474747"
noteTitleText = "#ffffff"

# Previous syntax roles retained for rollback:
# [custom_theme.syntax]
# keyword = "#059669"
# string = "#EAEAEA"
# comment = "#8A8A8A"
# operator = "#BEBEBE"
# variable = "#EAEAEA"

# Exact Shiki/TextMate scopes (hunk 0.20.x schema), mapped from koda-dark.
[custom_theme.syntax_scopes]
"comment" = "#505050"
"comment.block" = "#505050"
"comment.line" = "#505050"
"comment.block.documentation" = "#505050"
"punctuation.definition.comment" = "#505050"
"string" = "#ffffff"
"string.quoted.double" = "#ffffff"
"string.quoted.single" = "#ffffff"
"string.quoted.triple" = "#ffffff"
"string.template" = "#ffffff"
"constant.numeric" = "#d9ba73"
"constant.language" = "#d9ba73"
"constant.character" = "#d9ba73"
"constant.other" = "#d9ba73"
"variable" = "#b0b0b0"
"variable.other" = "#b0b0b0"
"keyword" = "#777777"
"keyword.control" = "#777777"
"storage" = "#777777"
"storage.modifier" = "#777777"
"storage.type" = "#777777"
"entity.name.class" = "#777777"
"entity.name.type" = "#777777"
"entity.other.inherited-class" = "#777777"
"entity.name.function" = "#ffffff"
"variable.parameter" = "#b0b0b0"
"entity.name.tag" = "#b0b0b0"
"entity.other.attribute-name" = "#777777"
"support.function" = "#ffffff"
"support.constant" = "#d9ba73"
"support.type" = "#777777"
"support.class" = "#777777"
"invalid" = "#ff7676"
"invalid.deprecated" = "#ff7676"
